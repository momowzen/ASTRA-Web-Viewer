<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASTRA BOSS TIMER</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg-base:#0d1117;--bg-surface:#161b22;--bg-elevated:#1a2332;
    --bg-overlay:#21262d;--bg-float:#252d3a;
    --border-subtle:rgba(255,255,255,0.04);--border-default:rgba(255,255,255,0.07);
    --border-active:rgba(88,166,255,0.15);--border-gold:rgba(210,153,29,0.18);
    --text-primary:#e6edf3;--text-secondary:#8b949e;--text-tertiary:#484f58;
    --accent:#58a6ff;--accent-dim:#1f487e;--gold:#d2991d;--gold-dim:#6e5012;
    --green:#3fb950;--green-dim:#1a7f2e;--red:#f85149;--red-dim:#8b1f1a;
    --purple:#a371f7;--cyan:#39d2c0;
    --radius:6px;--radius-sm:4px;--radius-lg:8px;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --font-mono:'JetBrains Mono','Cascadia Code',ui-monospace,monospace;
    --transition:150ms cubic-bezier(0.4,0,0.2,1);
    --shadow:0 1px 3px rgba(0,0,0,0.4),0 1px 2px rgba(0,0,0,0.2);
    --shadow-lg:0 4px 16px rgba(0,0,0,0.5);
  }

  html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg-base);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.12)}

  .app{height:100vh;display:flex;flex-direction:column;padding:6px 14px;gap:5px;max-width:1680px;margin:0 auto;width:100%}

  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:2px 2px 0}
  .brand{display:flex;align-items:center;gap:6px;user-select:none;flex-shrink:0}
  .brand-logo{width:22px;height:22px;border-radius:4px;object-fit:cover}
  .brand-text{font-size:14px;font-weight:700;letter-spacing:.5px;background:linear-gradient(135deg,var(--gold) 20%,var(--accent) 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .header-right{display:flex;align-items:center;gap:4px}

  .live-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:var(--bg-overlay);border:1px solid var(--border-default);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;transition:all var(--transition)}
  .live-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .live-pill.on{color:var(--green);border-color:rgba(63,185,80,0.3);background:rgba(63,185,80,0.07)}
  .live-pill.off{color:var(--red);border-color:rgba(248,81,73,0.3);background:rgba(248,81,73,0.07)}
  .live-pill.on .dot{box-shadow:0 0 8px var(--green);animation:lpulse 2s infinite}
  @keyframes lpulse{0%,100%{opacity:1}50%{opacity:.3}}

  .lang-pill,.alarm-btn,.voice-btn{appearance:none;background:var(--bg-overlay);border:1px solid var(--border-default);color:var(--text-secondary);padding:3px 8px;border-radius:20px;font-size:13px;line-height:1;cursor:pointer;font-family:var(--font);transition:all var(--transition)}
  .lang-pill:hover,.alarm-btn:hover,.voice-btn:hover{border-color:var(--border-active);color:var(--text-primary);background:var(--bg-float);transform:translateY(-1px)}
  .alarm-btn.on{color:var(--gold);border-color:var(--border-gold);background:rgba(210,153,29,0.08)}
  .alarm-btn.on:hover{border-color:rgba(210,153,29,0.4)}

  /* Nav */
  .nav{display:flex;gap:0;flex-shrink:0;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:2px}
  .nav-btn{appearance:none;background:transparent;border:none;color:var(--text-secondary);font-size:9px;font-weight:600;font-family:'Rajdhani',var(--font);padding:3px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
  .nav-btn:hover{color:var(--text-primary);background:var(--bg-elevated)}
  .nav-btn.active{color:var(--text-primary);background:var(--bg-elevated);box-shadow:var(--shadow)}

  .page{display:none;flex:1;min-height:0;flex-direction:column;gap:5px}
  .page.active{display:flex}

  /* Next Spawn Banner */
  .next-card{background:linear-gradient(135deg,var(--bg-elevated),var(--bg-surface));border:1px solid var(--border-gold);border-radius:var(--radius);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:border-color var(--transition)}
  .next-card::after{content:'';position:absolute;top:-50%;right:-15%;width:200px;height:200px;background:radial-gradient(circle,rgba(210,153,29,0.04) 0%,transparent 70%);pointer-events:none}
  .next-l{display:flex;align-items:center;gap:12px;z-index:1}
  .next-lbl{font-size:8px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);font-weight:600;opacity:.85;font-family:'Rajdhani',var(--font)}
  .next-name{font-size:18px;font-weight:700;color:var(--text-primary);line-height:1.1;font-family:'Rajdhani',var(--font);letter-spacing:.3px}
  .next-meta{display:flex;gap:4px;align-items:center;margin-top:1px}
  .next-tag{font-size:7px;padding:1px 5px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .next-tag.iv{background:rgba(88,166,255,0.1);color:var(--accent)}
  .next-tag.sc{background:rgba(163,113,247,0.1);color:var(--purple)}
  .next-lv{font-size:8px;color:var(--text-secondary);background:var(--bg-overlay);padding:0 5px;border-radius:3px}
  .next-r{text-align:right;z-index:1;flex-shrink:0;min-width:0}
  .next-cd{font-size:22px;font-weight:700;color:var(--gold);line-height:1;font-family:'Rajdhani',var(--font);letter-spacing:1.5px;font-variant-numeric:tabular-nums}
  .next-at{font-size:9px;color:var(--text-secondary);margin-top:1px}
  @keyframes countPulse{0%,100%{color:var(--gold)}50%{color:#f0c040}}

  /* Main Grid */
  .main-grid{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto auto 1fr;gap:5px;min-height:0}
  .main-grid>.panel:first-child{grid-row:1/4}
  .main-grid>.panel:nth-child(2){grid-row:1}
  .main-grid>.panel:nth-child(3){grid-row:2}
  .main-grid>.panel:nth-child(4){grid-row:3}
  .panel{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:6px 8px;min-height:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .panel-title{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--bg-surface);padding:0 0 5px 0;border-bottom:1px solid var(--border-subtle)}
  .panel-title .sub{color:var(--text-tertiary);font-weight:400;font-size:9px}
  #upcomingList,#historyList{overflow-y:auto;flex:1;min-height:0}

  /* Boss Cards (Today / Tomorrow) */
  .bc{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;margin-bottom:2px;border-radius:var(--radius);background:var(--bg-elevated);border:1px solid var(--border-subtle);transition:all var(--transition);cursor:default}
  .bc:hover{background:var(--bg-overlay);border-color:var(--border-default);transform:translateY(-1px);box-shadow:var(--shadow)}
  .bc:last-child{margin-bottom:0}
  .bc-nm{font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bc-tm{font-size:11px;color:var(--accent);font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;margin-left:8px}
  .empty{color:var(--text-tertiary);font-size:11px;font-style:italic;padding:8px 4px;text-align:center}

  /* Schedule Grid */
  .sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:4px;overflow-y:auto;min-height:0;align-content:start}
  .sc-day{background:var(--bg-elevated);border-radius:var(--radius);padding:7px 9px;border:1px solid var(--border-subtle);transition:all var(--transition)}
  .sc-day:hover{border-color:var(--border-default)}
  .sc-tdy{border-color:rgba(210,153,29,0.25);background:linear-gradient(135deg,var(--bg-elevated),rgba(210,153,29,0.03))}
  .sc-hdr{font-size:10px;font-weight:700;color:var(--purple);text-transform:uppercase;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--border-subtle);letter-spacing:.5px}
  .sc-tdy .sc-hdr{color:var(--gold);border-bottom-color:rgba(210,153,29,0.15)}
  .sc-row{display:flex;justify-content:space-between;align-items:center;padding:3px 2px;font-size:10px;gap:4px}
  .sc-nm{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:500}
  .sc-tm{color:var(--text-secondary);font-family:var(--font-mono);font-size:9px;flex-shrink:0}
  .sc-empty{font-size:10px;color:var(--text-tertiary);font-style:italic;padding:4px 0;text-align:center}

  /* Interval Groups */
  .ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:5px;overflow-y:auto;min-height:0;align-content:start}
  .ig-group{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:7px 9px;transition:all var(--transition)}
  .ig-group:hover{border-color:var(--border-default);box-shadow:var(--shadow)}
  .ig-hdr{font-size:10px;font-weight:700;color:var(--accent);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:center}
  .ig-ct{font-size:9px;color:var(--text-tertiary);font-weight:400}
  .ig-row{display:flex;justify-content:space-between;align-items:center;padding:3px 2px;font-size:11px;gap:4px}
  .ig-nm{color:var(--text-primary);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:11px}
  .ig-tm{font-size:10px;font-family:var(--font-mono);flex-shrink:0}
  .ig-live{color:var(--gold)}
  .ig-na{color:var(--text-tertiary)}
  @keyframes goldGlow{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 8px rgba(210,153,29,0.4)}}

  /* Status Bar */
  .status-bar{font-size:9px;color:var(--text-tertiary);text-align:center;padding:4px 0 0;flex-shrink:0;letter-spacing:.3px}
  /* Voice Panel */
  .voice-panel{position:fixed;top:50px;right:14px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:10px 14px;box-shadow:var(--shadow-lg);z-index:100;display:none;min-width:260px}
  .voice-panel.open{display:block}
  .voice-panel-header{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border-subtle)}
  .voice-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:10px}
  .voice-lang{color:var(--text-primary);font-weight:600;width:30px;flex-shrink:0}
  .voice-select{flex:1;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius);color:var(--text-primary);font-size:10px;padding:3px 5px;font-family:var(--font);outline:none;cursor:pointer}
  .voice-select:focus{border-color:var(--accent)}
  .voice-label{font-size:8px;color:var(--text-tertiary);padding:2px 0}

  /* History (inside panel) */
  .hist-list{display:flex;flex-direction:column;gap:1px}
  .hist-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:var(--radius);font-size:10px}
  .hist-item:hover{background:var(--bg-elevated)}
  .hist-icon{font-size:10px;width:16px;text-align:center;flex-shrink:0}
  .hist-name{color:var(--text-primary);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist-time{color:var(--text-secondary);margin-left:auto;flex-shrink:0;font-family:var(--font-mono);font-size:9px}
  .hist-type{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:600;text-transform:uppercase;flex-shrink:0}
  .hist-type.killed{color:var(--red);background:rgba(248,81,73,0.08)}
  .hist-type.missed{color:var(--gold);background:rgba(210,153,29,0.08)}

  /* Hidden Class Guide */
  #pageHidden .hc-section{flex:1;min-height:0}
  .hc-section{background:#161b22;border:1px solid var(--border-gold);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .hc-section-inner{padding:12px 14px;overflow-y:auto;flex:1;min-height:0}
  .hc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;align-content:start}
  .hc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
  .hc-card{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;transition:all var(--transition);cursor:default;display:flex;flex-direction:column}
  .hc-card:hover{border-color:var(--border-gold);box-shadow:var(--shadow);transform:translateY(-1px)}
  .hc-card-hdr{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;border-bottom:1px solid var(--border-subtle)}
  .hc-cicon{width:28px;height:28px;border-radius:var(--radius);overflow:hidden;flex-shrink:0;background:var(--bg-overlay)}
  .hc-img{width:100%;height:100%;object-fit:cover}
  .hc-cname{font-size:13px;font-weight:700;color:var(--text-primary);font-family:'Rajdhani',var(--font);letter-spacing:.3px}
  .hc-card-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
  .hc-sk-box{background:var(--bg-overlay);border-radius:var(--radius);padding:6px 8px;border:1px solid var(--border-subtle);flex-shrink:0}
  .hc-sk-lbl{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
  .hc-sk-txt{font-size:10px;color:var(--text-secondary);line-height:1.4}
  .hc-tags{display:flex;gap:3px;flex-wrap:wrap}
  .hc-tag{font-size:7px;padding:2px 6px;border-radius:var(--radius-sm);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)}
  .hc-tag.Combat{color:#e24d48}
  .hc-tag.Recon{color:#b56dd8}
  .hc-tag.Defense{color:#56c4c5}
  .hc-tag.Spell{color:#4d87f5}
  .hc-tag.Enhance{color:#d5a11d}
  .hc-tag.Support{color:#b38b7a}
  .hc-tag.Vitality{color:#6fc95e}
  .hc-tag.Trick{color:#d3d40f}
  .hc-pairs{display:flex;flex-direction:column;gap:3px}
  .hc-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .hc-pair-sk{font-size:12px;font-weight:600;padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);display:inline-flex;align-items:center;white-space:nowrap;overflow:hidden}
  .hc-type-icon{width:16px;height:16px;vertical-align:middle;margin-right:4px;border-radius:2px;flex-shrink:0}
  .hc-ps-Enhance{color:#d5a11d}
  .hc-ps-Trick{color:#d3d40f}
  .hc-ps-Recon{color:#b56dd8}
  .hc-ps-Defense{color:#56c4c5}
  .hc-ps-Support{color:#b38b7a}
  .hc-ps-Combat{color:#e24d48}
  .hc-ps-Spell{color:#4d87f5}
  .hc-ps-Vitality{color:#6fc95e}
  .hc-mils{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:1;align-content:start}
  .hc-milestone{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:3px;background:var(--bg-overlay);font-size:8px}
  .hc-milvl{flex-shrink:0;font-size:7px;font-weight:700;color:var(--text-tertiary);background:var(--bg-elevated);padding:0 3px;border-radius:2px;min-width:22px;text-align:center}
  .hc-mils-desc{font-size:8px;color:var(--text-secondary);line-height:1.3}
  .ms-val{color:var(--accent);font-weight:600}

  /* Mobile */
  @media(max-width:900px){
    .app{padding:6px 8px;gap:5px}
    .brand-text{font-size:13px}
    .brand-logo{width:22px;height:22px}
    .next-card{padding:10px 12px}
    .next-name{font-size:16px}
    .next-cd{font-size:20px}
    .main-grid{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:4px}
    .panel:nth-child(3),.panel:nth-child(4){display:none}
    .bc{padding:6px 8px}
    .bc-nm{font-size:11px}
    .bc-tm{font-size:10px}
    .sc-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
    .ig-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .hc-grid{grid-template-columns:1fr}
  }

  @media(max-width:480px){
    .header{padding:4px 0}
    .live-pill{font-size:9px;gap:4px;padding:2px 7px}
    .live-pill .dot{width:4px;height:4px}
    .next-cd{font-size:18px}
    .sc-grid{grid-template-columns:1fr 1fr}
    .ig-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand" id="brand"><img src="assets/logo.png" alt="" class="brand-logo"><span class="brand-text">ASTRA</span></div>
    <div class="header-right">
      <span class="live-pill off" id="livePill"><span class="dot"></span><span id="liveText">--</span></span>
      <button class="alarm-btn" id="alarmBtn">🔇</button>
      <button class="lang-pill" id="langBtn">🇺🇸</button>
      <button class="voice-btn" id="voiceBtn">⚙️</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-page="tracker" id="navTracker">TRACKER</button>
    <button class="nav-btn" data-page="hidden" id="navHidden">HIDDEN CLASS</button>
  </nav>

  <div class="page active" id="pageTracker">
  <div class="next-card">
    <div class="next-l">
      <div>
        <div class="next-lbl" id="nextLbl">Next Spawn</div>
        <div class="next-name" id="nextName">--</div>
        <div class="next-meta"><span class="next-lv" id="nextLv"></span><span class="next-tag" id="nextTag"></span></div>
      </div>
    </div>
    <div class="next-r">
      <div class="next-cd" id="nextCd">--:--:--</div>
      <div class="next-at" id="nextAt"></div>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-title"><span id="upcomingLbl">Upcoming</span> <span class="sub" id="upcomingSub"></span></div>
      <div id="upcomingList"></div>
    </div>
    <div class="panel">
      <div class="panel-title"><span id="ivTitle">Interval</span></div>
      <div class="ig-grid" id="ivGrid"></div>
    </div>
    <div class="panel">
      <div class="panel-title"><span id="schedTitle">Weekly</span></div>
      <div class="sc-grid" id="schedGrid"></div>
    </div>
    <div class="panel">
      <div class="panel-title"><span id="histLbl">Activity</span></div>
      <div class="hist-list" id="historyList"><div class="empty">Loading...</div></div>
    </div>
  </div>
  </div>

  <div class="page" id="pageHidden">
  <div class="hc-section">
  <div class="hc-section-inner">
    <div class="hc-grid" id="hiddenList"></div>
    </div>
  </div>
  </div>

  <div class="status-bar" id="exportInfo"></div>
</div>

<div class="voice-panel" id="voicePanel">
  <div class="voice-panel-header">TTS Voice Selection</div>
  <div id="voiceList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAboQqH7BmtLCO0ciHUvgGIUOU6SMzHnzo",
  authDomain: "astra-boss-timer-759e5.firebaseapp.com",
  projectId: "astra-boss-timer-759e5",
  storageBucket: "astra-boss-timer-759e5.firebasestorage.app",
  messagingSenderId: "136730864029",
  appId: "1:136730864029:web:62fc717006db8f36e8e774"
});
const db=firebase.firestore();
const BOSSES=[
  {id:"Venatus",name:"Venatus",lvl:60,rs:36000},

let alarmOn=false;
const ttsSpoken=new Set();
const ttsArmed=new Map();
function toggleAlarm(){
  alarmOn=!alarmOn;
  localStorage.setItem('astraalarm',alarmOn?'1':'0');
  updateAlarmBtn();
  if(!alarmOn&&window.speechSynthesis)window.speechSynthesis.cancel();
  if(alarmOn){ttsSpoken.clear();ttsArmed.clear();if(window.speechSynthesis){syncVoices();window.speechSynthesis.speak(new SpeechSynthesisUtterance(''))}}
}
function updateAlarmBtn(){
  const b=$('alarmBtn');
  b.textContent=alarmOn?'🔊':'🔇';
  b.classList.toggle('on',alarmOn);
}
let ttsVoices=[];
function ttsVoice(){
  if(!window.speechSynthesis)return null;
  const sv=localStorage.getItem('astraVoice_'+lang);
  if(sv){const m=ttsVoices.find(v=>v.name===sv);if(m)return m}
  const want={en:'en-US',ja:'ja-JP',ko:'ko-KR'}[lang];
  return ttsVoices.find(v=>v.lang===want)||ttsVoices.find(v=>v.lang.startsWith(lang))||null;
}
function speak(text,enText){
  if(!window.speechSynthesis||!text)return;
  const v=ttsVoice();
  const u=new SpeechSynthesisUtterance(v?text:(enText||text));
  if(v){u.voice=v;u.lang=v.lang}else{u.lang='en-US'}
  u.rate=1;u.pitch=1;
  window.speechSynthesis.speak(u);
}
function ttsCheck(){
  if(!alarmOn||!window.speechSynthesis)return;
  const n=now();
  for(const b of BOSSES){
    const tm=timers[b.id];
    if(!tm||!tm.endTime)continue;
    const rem=tm.endTime-n;
    if(rem>0)ttsArmed.set(b.id,tm.endTime);
    if(rem>0&&rem<=5*60000){
      const m=Math.ceil(rem/60000);
      const key=`${b.id}_${tm.endTime}_${m}`;
      if(!ttsSpoken.has(key)){ttsSpoken.add(key);speak(t('ttsIn')(bn(b),m),`${b.name} will respawn in ${m} minute${m!==1?'s':''}.`)}
    }else if(rem<=0&&rem>-60000){
      const armedEnd=ttsArmed.get(b.id);
      if(armedEnd===tm.endTime){
        const key=`${b.id}_${tm.endTime}_spawned`;
        if(!ttsSpoken.has(key)){ttsSpoken.add(key);speak(t('ttsSpawned')(bn(b)),`${b.name} has respawned.`);ttsArmed.delete(b.id)}
      }
    }
  }
}

let nxtBoss=null,nxtTime=null;

function p2(n){return String(n).padStart(2,'0')}
function now(){return Date.now()}

function fmt(ms){return new Date(ms).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Tokyo'})}
function fmtD(ms){return new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'Asia/Tokyo'})}
function fmtT(ms){return new Date(ms).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Tokyo'})}
function fmtDur(ms){if(ms<=0)return t('spawned');const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m ${p2(s%60)}s`}
function fmtShort(ms){if(ms<=0)return t('now');const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`}
function fmtInt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return m?`${h}h ${m}m`:`${h}h`}

function nextSpawn(b){
  const t=timers[b.id];
  if(b.rs){return t?.endTime?new Date(t.endTime):null}
  if(b.wr){const n=now(),base=new Date(n+TO);let best=null;for(const w of b.wr){const c=new Date(base),del=(w.d+7-base.getUTCDay())%7;c.setUTCDate(base.getUTCDate()+del);c.setUTCHours(w.h,w.m,0,0);let r=c.getTime()-TO;if(r<n)r+=604800000;if(!best||r<best)best=r}return best?new Date(best):null}
  return null
}
function schedB(){return BOSSES.filter(b=>b.wr)}
function intB(){return BOSSES.filter(b=>b.rs)}
function grpInt(){const g={};for(const b of intB()){const k=b.rs;if(!g[k])g[k]={s:k,b:[]};g[k].b.push(b)}return Object.values(g).sort((a,b)=>a.s-b.s)}

function rNext(){
  let bb=null,bs=null,cn=now();
  for(const b of BOSSES){const n=nextSpawn(b);if(n&&n.getTime()>cn&&(!bs||n.getTime()<bs.getTime())){bs=n;bb=b}}
  if(bb&&bs){
    $('nextName').textContent=bn(bb);$('nextLv').textContent=t('lv')+bb.lvl
    const isInt=!!bb.rs;$('nextTag').textContent=isInt?t('ivTag'):t('schedTag')
    $('nextTag').className='next-tag '+(isInt?'iv':'sc')
    $('nextAt').textContent=fmtT(bs.getTime())+' '+fmtD(bs.getTime())
    nxtBoss=bb;nxtTime=bs
  }else if(!nxtBoss||(nxtTime&&nxtTime.getTime()>cn)){
    $('nextName').textContent='--';$('nextLv').textContent='';$('nextTag').textContent='';$('nextAt').textContent='';nxtBoss=null;nxtTime=null
  }
}
function rNextCd(){
  if(nxtTime){const r=Math.max(0,nxtTime.getTime()-now());$('nextCd').textContent=fmtDur(r)}else $('nextCd').textContent='--:--:--'
}
setInterval(rNextCd,1000)

function rUpcoming(){
  const n=now(),list=[];
  for(const b of BOSSES){const x=nextSpawn(b);if(x&&x.getTime()>n)list.push({b,t:x.getTime()})}
  list.sort((a,b)=>a.t-b.t)
  const e=$('upcomingList');$('upcomingSub').textContent=list.length+' upcoming';
  if(!list.length){e.innerHTML='<div class="empty">'+t('noSpawns')+'</div>';return}
  e.innerHTML=list.map(x=>'<div class="bc"><span class="bc-nm">'+bn(x.b)+'</span><span class="bc-tm">'+fmtT(x.t)+'</span></div>').join('')
}

function rSched(){
  const j=new Date(now()+TO),cd=j.getUTCDay();
  const order=[1,2,3,4,5,6,0];
  const by=order.map(d=>({d,n:t('days')[d],es:[]}));
  for(const b of schedB())for(const w of b.wr){const col=by.find(x=>x.d===w.d);if(col)col.es.push({b,t:p2(w.h)+':'+p2(w.m)})}
  for(const d of by)d.es.sort((a,b)=>a.t.localeCompare(b.t))
  $('schedGrid').innerHTML=by.map(d=>'<div class="sc-day'+(d.d===cd?' sc-tdy':'')+'"><div class="sc-hdr">'+d.n+'</div>'+(d.es.length?d.es.map(e=>'<div class="sc-row"><span class="sc-nm">'+bn(e.b)+'</span><span class="sc-tm">'+e.t+'</span></div>').join(''):'<div class="sc-empty">--</div>')+'</div>').join('')
}

function rInt(){
  const n=now();$('ivGrid').innerHTML=grpInt().map(g=>'<div class="ig-group"><div class="ig-hdr"><span>'+t('every')+' '+fmtInt(g.s)+'</span><span class="ig-ct">'+g.b.length+'</span></div>'+g.b.map(b=>{const et=timers[b.id]?.endTime,al=et&&et>n;return'<div class="ig-row"><span class="ig-nm">'+bn(b)+'</span><span class="ig-tm '+(al?'ig-live':'ig-na')+'">'+(al?fmtShort(et-n):'--')+'</span></div>'}).join('')+'</div>').join('')
}

function rHidden(){
  const ht=(en)=>(HT[lang]&&HT[lang][en])||en;
  $('hiddenList').innerHTML=HIDDEN_CLASSES.map(c=>{
    const ts=new Set();c.pairs.forEach(p=>p.skills.forEach(s=>ts.add(s.type)));
    const tags=[...ts].map(t=>'<span class="hc-tag '+t+'">'+ht(t)+'</span>').join('');
    const pairs=c.pairs.map(p=>'<div class="hc-pair">'+p.skills.map(s=>'<span class="hc-pair-sk hc-ps-'+s.type+'"><img class="hc-type-icon" src="assets/'+s.type.toLowerCase()+'.png" alt=""> '+ht(s.name)+'</span>').join('')+'</div>').join('');
    const mils=c.milestones.map(m=>'<div class="hc-milestone"><span class="hc-milvl">'+m.lvl+'</span><span class="hc-mils-desc">'+ht(m.desc).replace(/(\+\d+(?:\.\d+)?%?)/g,'<span class="ms-val">$1</span>')+'</span></div>').join('');
    return'<div class="hc-card" tabindex="0"><div class="hc-card-hdr"><div class="hc-cicon"><img src="assets/'+c.className+'.png" alt="" class="hc-img"></div><span class="hc-cname">'+ht(c.className)+'</span></div><div class="hc-card-body"><div class="hc-sk-box"><div class="hc-sk-lbl">'+ht(c.skillName)+'</div><div class="hc-sk-txt">'+ht(c.skill)+'</div></div><div class="hc-tags">'+tags+'</div><div class="hc-pairs">'+pairs+'</div><div class="hc-mils">'+mils+'</div></div></div>'
  }).join('')
}

function setOnline(on){
  const lp=$('livePill'),lt=$('liveText')
  lp.className='live-pill '+(on?'on':'off')
  lt.textContent=on?t('live'):t('offline')
}

function listenData(){
  db.doc('timers/global').onSnapshot(snap=>{
    if(snap.exists){timers=snap.data().timers||{};rAll();ttsCheck();setOnline(true)}
  },()=>setOnline(false));
}

let histCache=[];
async function loadHistory(){
  try{
    const snap=await db.collection('history').orderBy('timestamp','desc').limit(30).get();
    histCache=snap.docs.map(d=>d.data());
    rHistory();
  }catch(e){}
}

    const ic=h.type==='killed'?'💀':'⏰';
    const tp=h.type==='killed'?t('killed'):t('missed');
    return'<div class="hist-item"><span class="hist-icon">'+ic+'</span><span class="hist-name">'+nm+'</span><span class="hist-type '+h.type+'">'+tp+'</span><span class="hist-time">'+fmtT(h.timestamp)+' '+fmtD(h.timestamp)+'</span></div>'
  }).join(''):'<div class="empty">'+t('noSpawns')+'</div>'
}

function syncVoices(){
  if(!window.speechSynthesis)return;
  const v=window.speechSynthesis.getVoices();
  if(!v.length)return;
  ttsVoices=v;
  const langs={en:'en-US',ja:'ja-JP',ko:'ko-KR'};
  const names={en:'English',ja:'Japanese',ko:'Korean'};
  $('voiceList').innerHTML=Object.keys(langs).map(l=>{
    const ls=v.filter(x=>x.lang.startsWith(l));
    const sv=localStorage.getItem('astraVoice_'+l)||'';
    return'<div class="voice-row"><span class="voice-lang">'+names[l]+'</span><select class="voice-select" data-lang="'+l+'"><option value="">Default</option>'+ls.map(x=>'<option value="'+x.name+'"'+(x.name===sv?' selected':'')+'>'+x.name.split('(')[0].trim()+'</option>').join('')+'</select></div>'
  }).join('')
}
$('voiceBtn').onclick=()=>{$('voicePanel').classList.toggle('open');syncVoices()}
document.addEventListener('change',e=>{if(e.target.classList.contains('voice-select')){localStorage.setItem('astraVoice_'+e.target.dataset.lang,e.target.value)}})
if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener('voiceschanged',()=>syncVoices());setTimeout(()=>syncVoices(),500)}
lang=localStorage.getItem('astralang')||'en';alarmOn=localStorage.getItem('astraalarm')==='1';applyLang();updateAlarmBtn();listenData();loadHistory();rAll()
setInterval(()=>{rNext();rUpcoming();rSched();rInt();rHidden()},15000)
setInterval(loadHistory,60000)
setInterval(ttsCheck,3000)
</script>
