<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>ASTRA</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260805">
</head>
<body>

  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8b5cf6" />
        <stop offset="50%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#22d3ee" />
      </linearGradient>
    </defs>
  </svg>

  <div class="bg-canvas" aria-hidden="true">
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <div class="stars"></div>
    <div class="aurora"></div>
    <div class="vignette"></div>
  </div>

  <div class="astra-app">
    <header class="astra-header">
      <div class="brand" id="brand">
        <img src="assets/logo.png" alt="" class="brand-logo">
        <span class="brand-text">ASTRA</span>
      </div>
      <div class="header-actions">
        <span class="live-pill off" id="livePill" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="liveText">--</span>
        </span>
        <button class="icon-btn" id="alarmBtn" aria-label="Toggle voice alarm" title="Toggle voice alarm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>
        <button class="icon-btn lang-btn" id="langBtn" aria-label="Switch language" title="Switch language">
          <span id="langText">EN</span>
        </button>
      </div>
    </header>

    <nav class="astra-nav" aria-label="Main navigation">
      <div class="nav-pill">
        <button class="nav-btn active" data-page="tracker" id="navTracker">Tracker</button>
        <button class="nav-btn" data-page="hidden" id="navHidden">Hidden Class</button>
        <button class="nav-btn" data-page="relic" id="navRelic"><span id="relicNavLbl">Relic</span></button>
      </div>
    </nav>

    <div class="page active" id="pageTracker">
      <section class="hero-next" id="heroNext" aria-label="Next spawn">
        <div class="hero-status-ring" aria-hidden="true">
          <div class="center-glow"></div>
          <img class="hero-boss-img" id="heroBossImg" alt="">
          <svg viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="44"></circle>
            <circle class="progress" id="heroProgress" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"></circle>
          </svg>
        </div>
        <div class="hero-info">
          <div class="hero-label" id="nextLbl">Next Spawn</div>
          <h1 class="hero-name" id="nextName">--</h1>
          <div class="hero-meta">
            <span class="hero-lv" id="nextLv"></span>
            <span class="hero-loc" id="nextLoc"></span>
            <span class="hero-tag" id="nextTag"></span>
          </div>
          <div class="hero-at" id="nextAt"></div>
        </div>
        <div class="hero-countdown">
          <div class="hero-countdown-value" id="nextCd">--:--:--</div>
          <div class="hero-countdown-label" id="nextCdLabel">Time Remaining</div>
        </div>
      </section>

      <div class="dashboard-grid">
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span id="upcomingLbl">Upcoming</span>
            </div>
            <span class="panel-count" id="upcomingSub"></span>
          </div>
          <div class="panel-body" id="upcomingList"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span id="viewTitle">Interval</span>
            </div>
            <div class="segmented" role="tablist" aria-label="View mode">
              <button type="button" class="seg-btn active" id="ivBtn" data-view="interval" role="tab" aria-selected="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                <span id="ivBtnLbl">Interval</span>
              </button>
              <button type="button" class="seg-btn" id="schedBtn" data-view="schedule" role="tab" aria-selected="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span id="schedBtnLbl">Schedule</span>
              </button>
            </div>
          </div>
          <div class="panel-body" id="ivGrid"></div>
          <div class="panel-body" id="schedGrid" hidden></div>
        </div>
      </div>
    </div>

    <div class="page hidden-page" id="pageHidden">
      <div class="ptr-indicator" id="ptrIndicator" aria-hidden="true"></div>
      <div class="hidden-scroll" id="hiddenScroll">
        <div class="hidden-grid" id="hiddenList"></div>
      </div>
    </div>

    <div class="page relic-page" id="pageRelic">
      <div class="relic-scroll" id="relicScroll">
        <div class="relic-grid">
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6-6.3 4.6L8 14 2 9.4h7.6z"></path></svg>
                <span id="relicLbl">Relic Levels</span>
              </div>
              <span class="panel-count" id="relicCount">4</span>
            </div>
            <div class="panel-body relic-body" id="relicSettings">

              <div class="relic-row" id="relicRow0">
                <span class="relic-dot re-0" aria-hidden="true"></span>
                <span class="relic-name" id="relicName0"></span>
                <div class="relic-inputs">
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicFrom0" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label" id="relicCurLbl">Current</span>
                  </div>
                  <span class="relic-arrow">&rarr;</span>
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicTo0" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label" id="relicGoalLbl">Goal</span>
                  </div>
                </div>
                <span class="relic-tp" id="relicTp0">0</span>
              </div>

              <div class="relic-row" id="relicRow1">
                <span class="relic-dot re-1" aria-hidden="true"></span>
                <span class="relic-name" id="relicName1"></span>
                <div class="relic-inputs">
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicFrom1" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label">Current</span>
                  </div>
                  <span class="relic-arrow">&rarr;</span>
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicTo1" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label">Goal</span>
                  </div>
                </div>
                <span class="relic-tp" id="relicTp1">0</span>
              </div>

              <div class="relic-row" id="relicRow2">
                <span class="relic-dot re-2" aria-hidden="true"></span>
                <span class="relic-name" id="relicName2"></span>
                <div class="relic-inputs">
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicFrom2" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label">Current</span>
                  </div>
                  <span class="relic-arrow">&rarr;</span>
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicTo2" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label">Goal</span>
                  </div>
                </div>
                <span class="relic-tp" id="relicTp2">0</span>
              </div>

              <div class="relic-row" id="relicRow3">
                <span class="relic-dot re-3" aria-hidden="true"></span>
                <span class="relic-name" id="relicName3"></span>
                <div class="relic-inputs">
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicFrom3" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label">Current</span>
                  </div>
                  <span class="relic-arrow">&rarr;</span>
                  <div class="relic-field">
                    <input type="number" class="relic-num" id="relicTo3" min="1" max="100" value="1" inputmode="numeric">
                    <span class="relic-field-label">Goal</span>
                  </div>
                </div>
                <span class="relic-tp" id="relicTp3">0</span>
              </div>

              <div class="relic-total">
                <span class="relic-total-label" id="relicTotalLbl">Total Temporal Pieces</span>
                <span class="relic-total-value" id="relicTotal">0</span>
              </div>
              <div class="relic-total-sub" id="relicTotalSub"></div>

            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 6 1 22 23 22 23 6"></polyline><path d="M12 22c-4 0-6-4-6-8s2-8 6-8 6 4 6 8-2 8-6 8z"></path><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
                <span id="mktLbl">Live Market Prices</span>
              </div>
              <div class="mkt-actions">
                <span class="mkt-realm" id="mktRealm">Origin</span>
                <button class="icon-btn mkt-refresh" id="mktRefresh" title="Refresh" aria-label="Refresh market prices">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
                </button>
              </div>
            </div>
            <div class="panel-body mkt-body" id="mktBody">
              <div class="mkt-status" id="mktStatus">
                <span class="mkt-updated" id="mktUpdated">--</span>
                <div class="segmented mkt-currency" role="tablist" aria-label="Currency">
                  <button type="button" class="seg-btn active" data-cur="usd" role="tab" aria-selected="true">USDt</button>
                  <button type="button" class="seg-btn" data-cur="php" role="tab" aria-selected="false">PHP</button>
                  <button type="button" class="seg-btn" data-cur="jpy" role="tab" aria-selected="false">JPY</button>
                  <button type="button" class="seg-btn" data-cur="krw" role="tab" aria-selected="false">KRW</button>
                </div>
              </div>
              <div class="mkt-state" id="mktState"></div>
              <div class="mkt-table-wrap" id="mktTableWrap" hidden>
                <table class="mkt-table">
                  <thead>
                    <tr>
                      <th class="l">Tier</th>
                      <th class="r">TP/Chest</th>
                      <th class="r">USDt</th>
                      <th class="r" id="mktCurHead">Price</th>
                    </tr>
                  </thead>
                  <tbody id="mktRows"></tbody>
                </table>
              </div>
              <div class="mkt-reco" id="mktReco" hidden></div>
              <div class="mkt-save" id="mktSave" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar" id="exportInfo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <span>Initializing ASTRA...</span>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="app.js?v=20260805"></script>
</body>
</html>
